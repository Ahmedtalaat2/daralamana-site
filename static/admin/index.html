  :root, :root[data-theme=light], :root[data-theme=dark] {
    --sui-base-hue: 262 !important;
    --sui-font-family-default: "IBM Plex Sans Arabic", system-ui, sans-serif !important;

  /* branded backdrop behind the sign-in screen and while loading */

  /* developer signature (sign-in screen only) */
  #dev-sig { position: fixed; left: 0; right: 0; bottom: 44px; z-index: 9999; display: flex; justify-content: center; align-items: center; gap: 10px;
    font: 500 13px/1.4 "IBM Plex Sans Arabic", system-ui, sans-serif; color: #6b6280; direction: rtl; white-space: nowrap; }
  #dev-sig a { display: inline-flex; align-items: center; gap: 5px; color: #12998A; font-weight: 600; text-decoration: none; direction: ltr; }
  #dev-sig a:hover { text-decoration: underline; }
  #dev-sig svg { width: 15px; height: 15px; }
  #dev-sig[hidden] { display: none; }
  /* password gate */
  #gate { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 16px; direction: rtl;
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; color: #24173F; }
  #gate[hidden], .pw-modal[hidden] { display: none; }
  .g-card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #ECE6F7; border-radius: 22px; padding: 32px 26px 26px;
    box-shadow: 0 24px 60px -24px rgba(59,40,112,.35); text-align: center; }
  .g-card img { width: 64px; height: 64px; object-fit: contain; }
  .g-card h1 { font-size: 21px; margin: 12px 0 4px; font-weight: 700; }
  .g-card p { margin: 0 0 20px; color: #6b6280; font-size: 14px; }
  .g-card label { display: block; text-align: right; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .g-card input { width: 100%; box-sizing: border-box; height: 50px; border: 1.5px solid #DCD3EE; border-radius: 14px; padding: 0 14px;
    font: 500 16px "IBM Plex Sans Arabic", system-ui, sans-serif; margin-bottom: 14px; outline: none; direction: ltr; text-align: right; }
  .g-card input:focus { border-color: #5A3E98; box-shadow: 0 0 0 4px rgba(90,62,152,.12); }
  .g-card button { width: 100%; height: 50px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #3B2870, #5A3E98); color: #fff;
    font: 600 16px "IBM Plex Sans Arabic", system-ui, sans-serif; cursor: pointer; }
  .g-card button[disabled] { opacity: .7; cursor: wait; }
  .g-card .g-alt { background: #F3EFFA; color: #3B2870; margin-top: 10px; }
  .g-err { min-height: 20px; color: #C0392B; font-size: 13px; margin: -4px 0 10px; text-align: right; }
  .g-ok { color: #12998A; }
  #pw-btn { position: fixed; left: 14px; bottom: 14px; z-index: 8000; border: 1px solid #DCD3EE; background: #fff; color: #3B2870; border-radius: 999px;
    padding: 7px 14px; font: 600 12.5px "IBM Plex Sans Arabic", system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 18px -8px rgba(59,40,112,.3); }
  #pw-btn[hidden] { display: none; }
  .pw-modal { position: fixed; inset: 0; z-index: 9500; background: rgba(36,23,63,.45); display: flex; align-items: center; justify-content: center; padding: 16px; direction: rtl;
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; color: #24173F; }

  (function () {

    function light() { if (root.getAttribute("data-theme") !== "light") root.setAttribute("data-theme", "light"); }
    light(); new MutationObserver(light).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>

<div id="gate" hidden>
  <form class="g-card" id="g-login">
    <img src="../assets/img/logo-icon.png" alt="">
    <h1>لوحة تحكم دار الأمانة</h1>
    <p>اكتب كلمة المرور للدخول</p>
    <label for="g-pass">كلمة المرور</label>
    <input id="g-pass" type="password" autocomplete="current-password" required>

    <button type="button" class="g-alt" id="g-renew">تحديث توكن GitHub</button>

  <form class="g-card" id="g-setup" hidden>
    <img src="../assets/img/logo-icon.png" alt="">
    <h1>إعداد الدخول لأول مرة</h1>
    <p>الخطوة دي مرة واحدة بس: حط توكن GitHub واختار كلمة مرور.</p>
    <label for="s-token">توكن GitHub</label>
    <input id="s-token" type="password" autocomplete="off" required>

<button id="pw-btn" type="button" hidden>🔒 تغيير كلمة المرور</button>
<div class="pw-modal" id="pw-modal" hidden>
  <form class="g-card" id="pw-form">
    <h1>تغيير كلمة المرور</h1>
    <p>كلمة المرور الجديدة تشتغل خلال دقيقة أو اتنين.</p>
    <label for="p-new">كلمة المرور الجديدة (10 حروف على الأقل)</label>
    <input id="p-new" type="password" autocomplete="new-password" minlength="10" required>
    <label for="p-new2">تأكيد كلمة المرور</label>
    <input id="p-new2" type="password" autocomplete="new-password" minlength="10" required>
    <div class="g-err" id="p-err"></div>
    <button type="submit">حفظ</button>
    <button type="button" class="g-alt" id="p-cancel">إلغاء</button>
  </form>
</div>
<script>
(function () {
  var REPO = "Ahmedtalaat2/daralamana-site", BRANCH = "main", FILE = "static/admin/auth.json";
  var CMS = "https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js", KEY = "sveltia-cms.user", ITER = 600000;
  var $ = function (id) { return document.getElementById(id); };
  var enc = new TextEncoder(), dec = new TextDecoder();
  var b64 = function (u) { return btoa(String.fromCharCode.apply(null, new Uint8Array(u))); };
  var unb64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };

  function stored() { try { var u = JSON.parse(localStorage.getItem(KEY) || "null"); return u && u.token ? u : null; } catch (e) { return null; } }
  async function keyFrom(pass, salt, iter) {
    var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function seal(token, pass) {
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, await keyFrom(pass, salt, ITER), enc.encode(token));
    return { v: 1, iter: ITER, salt: b64(salt), iv: b64(iv), data: b64(ct) };
  }
  async function unseal(box, pass) {
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, await keyFrom(pass, unb64(box.salt), box.iter), unb64(box.data));
    return dec.decode(pt);
  }
  async function gh(token, path, opt) {
    opt = opt || {}; opt.headers = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" };
    return fetch("https://api.github.com" + path, opt);
  }
  async function saveBox(token, box, msg) {
    var url = "/repos/" + REPO + "/contents/" + FILE, sha;
    var r = await gh(token, url + "?ref=" + BRANCH);
    if (r.ok) sha = (await r.json()).sha; else if (r.status !== 404) throw new Error("gh " + r.status);
    var body = { message: msg, branch: BRANCH, content: btoa(JSON.stringify(box, null, 2) + "\n") };
    if (sha) body.sha = sha;
    r = await gh(token, url, { method: "PUT", body: JSON.stringify(body) });
    if (!r.ok) throw new Error("gh " + r.status);
  }
  async function checkToken(token) {
    try {
      var r = await gh(token, "/repos/" + REPO);
      if (r.status === 401) return "توكن GitHub انتهى أو اتلغى. دوس تحديث توكن GitHub.";
      if (!r.ok) return "التوكن مالوش صلاحية على المستودع. دوس تحديث توكن GitHub.";
      var j = await r.json();
      if (j.permissions && !j.permissions.push) return "التوكن صلاحيته قراءة بس، لازم Contents: Read and write.";
      return "";
    } catch (e) { return ""; }
  }
  function startCMS(token) {
    if (token) localStorage.setItem(KEY, JSON.stringify({ backendName: "github", token: token }));
    $("gate").hidden = true; $("dev-sig").hidden = true;
    var s = document.createElement("script"); s.src = CMS; document.body.appendChild(s);
    watch();
  }
  function busy(form, on) { var b = form.querySelector("button[type=submit]"); b.disabled = on; }

  // after sign-out, Sveltia shows its own GitHub sign-in screen; go back to the password screen instead
  var since = 0;
  function watch() {
    function check() {
      var signedIn = !!stored() && !!document.querySelector("[role=navigation], nav, header[role=banner]");
      $("pw-btn").hidden = !signedIn;
      var onSignIn = /Sign In/i.test(document.body.innerText || "") && !document.querySelector("[role=navigation], nav, header[role=banner]");
      if (!onSignIn) { since = 0; return; }
      if (!stored()) return location.reload();               // signed out
      if (!since) since = Date.now();
      if (Date.now() - since > 12000) {                       // stuck on GitHub sign-in: token rejected
        localStorage.removeItem(KEY); try { sessionStorage.setItem("gate-msg", "التوكن مش شغال، دوس تحديث توكن GitHub."); } catch (e) {}
        location.reload();
      }
    }
    new MutationObserver(check).observe(document.body, { childList: true, subtree: true }); setInterval(check, 1000); check();
  }

  async function boot() {
    if (stored()) return startCMS();
    $("gate").hidden = false; $("dev-sig").hidden = false;
    var box = null;
    try { var r = await fetch("auth.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) box = await r.json(); } catch (e) {}
    if (!box || !box.data) { $("g-login").hidden = true; $("g-setup").hidden = false; }
    try { var m = sessionStorage.getItem("gate-msg"); if (m) { $("g-err").textContent = m; sessionStorage.removeItem("gate-msg"); } } catch (e) {}

    $("g-renew").onclick = function () { $("g-login").hidden = true; $("g-setup").hidden = false; };
    $("g-login").onsubmit = async function (e) {
      e.preventDefault(); busy(this, true); $("g-err").textContent = "";
      var form = this, tok;
      try { tok = await unseal(box, $("g-pass").value); }
      catch (err) { $("g-err").textContent = "كلمة المرور غلط، جرّب تاني."; busy(form, false); return; }
      var why = await checkToken(tok);
      if (why) { $("g-err").textContent = why; busy(form, false); return; }
      startCMS(tok);
    };
    $("g-setup").onsubmit = async function (e) {
      e.preventDefault(); var t = $("s-token").value.trim(), p = $("s-pass").value;
      if (p !== $("s-pass2").value) { $("s-err").textContent = "كلمتين المرور مش زي بعض."; return; }
      busy(this, true); $("s-err").textContent = "";
      try { await saveBox(t, await seal(t, p), "إعداد كلمة مرور لوحة التحكم"); startCMS(t); }
      catch (err) { $("s-err").textContent = "التوكن مش شغال أو مالوش صلاحية على المستودع."; busy(this, false); }
    };
  }

  $("pw-btn").onclick = function () { $("pw-modal").hidden = false; $("p-err").textContent = ""; $("pw-form").reset(); };
  $("p-cancel").onclick = function () { $("pw-modal").hidden = true; };
  $("pw-form").onsubmit = async function (e) {
    e.preventDefault(); var p = $("p-new").value, form = this, u = stored();
    if (p !== $("p-new2").value) { $("p-err").textContent = "كلمتين المرور مش زي بعض."; return; }
    busy(form, true); $("p-err").className = "g-err"; $("p-err").textContent = "جاري الحفظ...";
    try {
      await saveBox(u.token, await seal(u.token, p), "تغيير كلمة مرور لوحة التحكم");
      $("p-err").className = "g-err g-ok"; $("p-err").textContent = "تم تغيير كلمة المرور.";
      setTimeout(function () { $("pw-modal").hidden = true; busy(form, false); }, 1600);
    } catch (err) { $("p-err").className = "g-err"; $("p-err").textContent = "حصل خطأ، جرّب تاني."; busy(form, false); }
  };
  boot();
})();
</script>
