<style>
  /* Dar Alamana brand theme for Sveltia CMS */
  :root, :root[data-theme=light], :root[data-theme=dark] {
    --sui-base-hue: 262 !important;
    --sui-font-family-default: "IBM Plex Sans Arabic", system-ui, sans-serif !important;

  }
  :root, :root[data-theme=light] {
    --sui-primary-accent-color: #5A3E98 !important;
    --sui-primary-accent-color-light: #6B4DB0 !important;
    --sui-primary-accent-color-dark: #3B2870 !important;
    --sui-primary-accent-color-text: #5A3E98 !important;
    --sui-primary-accent-color-inverted: #ffffff !important;
    --sui-focus-ring-color: rgba(23,184,166,.55) !important;
  }
  :root[data-theme=dark] {
    --sui-primary-accent-color: #7B5CC4 !important;
    --sui-primary-accent-color-light: #8E70D3 !important;
    --sui-primary-accent-color-dark: #5A3E98 !important;
    --sui-primary-accent-color-text: #CAB1EA !important;
  }
  /* branded backdrop behind the sign-in screen and while loading */
  html, body { background: #fff; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(600px 460px at 0% 10%, rgba(155,120,215,.16), transparent 70%),
                radial-gradient(560px 440px at 100% 90%, rgba(23,184,166,.10), transparent 70%); }
  /* developer signature (sign-in screen only) */
  #dev-sig { position: fixed; left: 0; right: 0; bottom: 44px; z-index: 9999; display: flex; justify-content: center; align-items: center; gap: 10px;
    font: 500 13px/1.4 "IBM Plex Sans Arabic", system-ui, sans-serif; color: #6b6280; direction: rtl; white-space: nowrap; }
  #dev-sig a { display: inline-flex; align-items: center; gap: 5px; color: #12998A; font-weight: 600; text-decoration: none; direction: ltr; }
  #dev-sig a:hover { text-decoration: underline; }
  #dev-sig svg { width: 15px; height: 15px; }
  #dev-sig[hidden] { display: none; }

<script>

  (function () {
    var root = document.documentElement;
    function light() { if (root.getAttribute("data-theme") !== "light") root.setAttribute("data-theme", "light"); }
    light(); new MutationObserver(light).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>

<script>
  // show the signature only on the sign-in screen
  (function () {
    var sig = document.getElementById("dev-sig");
    document.getElementById("dev-year").textContent = new Date().getFullYear();
